<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeetCode Exporter Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container wide">
      <h1>Settings</h1>

      <label class="field">
        <span class="label">GitHub token</span>
        <input type="password" id="githubToken" placeholder="ghp_..." />
      </label>

      <div class="grid">
        <label class="field">
          <span class="label">Repo owner</span>
          <input type="text" id="repoOwner" placeholder="your-user" />
        </label>
        <label class="field">
          <span class="label">Repo name</span>
          <input type="text" id="repoName" placeholder="leetcode" />
        </label>
      </div>

      <div class="grid">
        <label class="field">
          <span class="label">Branch</span>
          <input type="text" id="branch" placeholder="main" />
        </label>
        <label class="field">
          <span class="label">Base dir in repo</span>
          <input type="text" id="baseDir" placeholder="leetcode" />
        </label>
      </div>

      <label class="field">
        <span class="label">Data structures (JSON)</span>
        <textarea id="dataStructures" rows="6"></textarea>
        <span class="hint">Example: {"array":"array","string":"string"}</span>
      </label>

      <label class="field">
        <span class="label">Languages (JSON)</span>
        <textarea id="languages" rows="6"></textarea>
        <span class="hint">Example: {"cpp":{"label":"C++","ext":"cpp"}}</span>
      </label>

      <label class="field">
        <span class="label">Default language key</span>
        <input type="text" id="defaultLanguage" placeholder="cpp" />
      </label>

      <div class="actions">
        <button id="save" class="primary">Save settings</button>
        <span id="message" class="muted"></span>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
