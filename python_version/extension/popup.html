<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save LeetCode</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Save LeetCode</h1>
      <p class="muted" id="status">Open a LeetCode problem page.</p>

      <div class="card">
        <div class="row">
          <span class="label">Problem</span>
          <span id="problem-title">-</span>
        </div>
        <div class="row">
          <span class="label">ID</span>
          <span id="problem-id">-</span>
        </div>
        <div class="row">
          <span class="label">Difficulty</span>
          <span id="problem-difficulty">-</span>
        </div>
        <div class="row">
          <span class="label">Tags</span>
          <span id="problem-tags">-</span>
        </div>
      </div>

      <label class="field">
        <span class="label">Data structure</span>
        <select id="structure"></select>
      </label>

      <label class="field">
        <span class="label">Language</span>
        <select id="language"></select>
      </label>

      <label class="checkbox">
        <input type="checkbox" id="include-readme" checked />
        Include README.md
      </label>

      <button id="save" class="primary">Save to GitHub</button>
      <p class="muted" id="message"></p>

      <a class="link" href="options.html" target="_blank" rel="noreferrer">Open settings</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
